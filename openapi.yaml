        question:
          title: Question
          maxLength: 3000
          minLength: 1
          type: string
          description: question to ask
        stream:
          title: Stream
          type: boolean
          description: If set, partial message deltas will be sent, like in ChatGPT of [OpenAI](https://platform.openai.com/docs/api-reference/chat/create#stream). Tokens will be sent as data-only server-sent events as they become available.
          default: true
        selected_meta:
          title: Selected Meta
          anyOf:
            - $ref: "#/components/schemas/SelectedMeta"
            - $ref: "#/components/schemas/HtmlSelectedMeta"
          description: When use [**Ask About Selected Text**](https://chatdoc.com/blog/4-ways-to-make-queries/#3.-ask-about-selected-text), this field is acquired from [EVENT_TYPES.CHAT_ICON_CLICKED](/#section/ChatDOC-Document-Viewer/EVENT_TYPES) of our DOCViewerSDK, and then filled with the document `upload_id`, when ask upon a collection, it's the sub document id of collection.
        history:
          title: History
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          description: "chat history, used for [Threaded Chat](https://chatdoc.com/blog/2-ways-to-dive-deeper/#1.-start-a-thread), this parameter simulates [OpenAI' API](https://platform.openai.com/docs/guides/gpt/chat-completions-api). `history` is question and answer pairs, which is a list of `ChatMessage` objects. The max input tokens of `history`, `selected_meta.material` and `question` is 8000, which is a little less than OpenAI's limit of [Embedding models](https://platform.openai.com/docs/guides/embeddings/what-are-embeddings). Sample parameter is as follows:\n\n        [\n          {\"role\": \"user\", \"content\": \"Who...\"},\n          {\"role\": \"assistant\", \"content\": \"The...\"},\n          {\"role\": \"user\", \"content\": \"Where...\"}\n          {\"role\": \"assistant\", \"content\": \"The...\"},\n        ]\n        "
          default: []
        search_entire_doc:
          title: Search Entire Doc
          type: boolean
          description: "if true: limit responses to current file's information, else: responses go freely with knowledge of our AI"
          default: true
        detailed_citation:
          title: Detailed Citation
          type: boolean
          description: Whether to show the source at the end of each sentence or not. Requires enabling the `search_entire_doc` setting.
          default: false
        language:
          title: Language
          type: string
          description: preferred language of answer to the question, if not provided, we will try to detect the language automatically, which is flexible and also works well. You'd better use [ISO language name](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes?useskin=vector), such as English, Chinese. But we can't promise, when AI can't answer your question well, it generally answers in English.
