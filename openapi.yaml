  /questions:
    post:
      tags:
        - Questions
      summary: Ask Question
      description: |-
        Chat with the document, response in [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events) mode by default, you can change it through `stream` parameter.

        Consume one question quota whether it's upon single document or collection.

        **Response**:

        Structure is generally as follows:

        ```json
        {
            "data": {
                "answer": "answer to the question",
                "id": question_id,
                "source_info": [
                    {
                        # key: page number
                        # value: rects
                        "0": [[38.1063, 557.8058, 553.9003, 584.0043]]
                    },
                    {"1": [[38.0, 152.3994, 523.6151, 178.6392]]},
                    {"0": [[38.0, 758.0623, 537.0082, 784.0]]},
                    ...
                ]
            }
        }
        ```

        * `answer`: chunks of answer, may be Markdown format to support rich text, for example: [Tables](https://github.com/adam-p/markdown-here/wiki/Markdown-Cheatsheet#tables). For `detailed_citation` answer, the span tag chunk may be as follows:

            ```
            autobiography captured the pre-Nazi Europe[<span data-index="0">1</span>]
            ```

            The tag attr `data-index` is the index of the source in `source_info` array, which is used to highlight the source of the previous answer sentences in your PDF viewer. The highlighting method is same as `source_info`, and just use slice of `source_info` array as parameter.

        * `id`: id of the question, you can use it to `GET /questions/{question_id}` later.

        **Please note**: you should store `id` in your database, because we don't have a `GET /questions/list` API to list all questions for now.

        * `source_info`: only responses in the last chunk of server-sent events mode, may be an empty list. So if the last chunk doesn't contain `source_info` attr, it means error occurred. Page number may not be ordered, you can use this information to highlight the source of specific `upload_id` document of the answer in your PDF viewer, by
            calling [`drawSources`](/#section/ChatDOC-Document-Viewer/Methods) method of our DOCViewerSDK, and converting `source_info` to [`Source`](/#section/ChatDOC-Document-Viewer/Source) parameter.

            **For document of pdf/doc/docx format**:

            Structure of `source_info` may be as follows:

            ```json
            {
                "source_info": [
                    {
                        # key: page number
                        # value: rects
                        "0": [[38.1063, 557.8058, 553.9003, 584.0043]]
                    },
                ]
            }
            ```

            For [`Selected Text`](https://chatdoc.com/blog/4-ways-to-make-queries/#3.-ask-about-selected-text) query type and when `search_entire_doc` is `False`, structure of `source_info` is as follows no matter single document or collection:

            ```json
            {
                "source_info": [
                    {
                        "rects": {
                            "0": [[38.1063, 557.8058, 553.9003, 584.0043]]
                        },
                        "upload_id": "xxxx"
                    },
                ]
            }
            ```

            **For document of md/epub/txt/website format**:

            Structure of `source_info` may be as follows:

            ```json
            {
                "source_info": [
                    {
                        # key: element data-index
                        # value: element xpath
                        "198": [{xpath: "/html/body/div/div[199]"}]
                    },
                ]
            }
            ```

            For [`Selected Text`](https://chatdoc.com/blog/4-ways-to-make-queries/#3.-ask-about-selected-text) query type and when `search_entire_doc` is `False`, structure of `source_info` is as follows no matter single document or collection:

            ```json
            {
                "source_info": [
                    {
                        "material": "", # selected text with HTML tags
                        "indexes": [
                            3,
                            4,
                            5,
                            6
                        ],
                        "focusNode": "div[1]/p[5]/text()[1]",
                        "upload_id": "xxxx",
                        "anchorNode": "div[1]/p[2]/text()[1]",
                        "focusOffset": "225",
                        "anchorOffset": "2"
                    }
                    ...
                ]
            }
            ```

            **For `collection` type**:

            Structure of `source_info` is generally as follows, which sub document `upload_id` of collection is wrapped in, and `rects` and `element xpath` is wrapped inner:

            ```json
            {
                "source_info": [
                    { # sub document of pdf/doc/docx format
                        "rects": {
                            "0": [[38.1063, 557.8058, 553.9003, 584.0043]]
                        },
                        "upload_id": "xxxx"
                    },
                    { # sub document of md/epub/txt/website format
                        "rects": {
                            "198": [{xpath: "/html/body/div/div[199]"}]
                        },
                        "upload_id": "xxxx"
                    },
                ]
            }
            ```
      operationId: Ask_Question_questions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionReq"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security:
        - HTTPBearer: []
